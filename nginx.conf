events {}
http {
    server {
        # Nginx escuchará en el puerto 8080
        listen 8080;
        
        location / {
            # 1. Destruir cualquier cabecera CORS que venga del VROOM original
            proxy_hide_header 'Access-Control-Allow-Origin';
            proxy_hide_header 'Access-Control-Allow-Methods';
            
            # 2. Agregar estrictamente solo tu dominio (o solo el asterisco, pero no ambos)
            add_header 'Access-Control-Allow-Origin' 'https://donpiig-dev.github.io' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

            # Responder automáticamente al Preflight
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://donpiig-dev.github.io';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            proxy_pass http://localhost:3000;
        }
    }
}
