events {}
http {
    server {
        # Nginx escuchará en el puerto 8080
        listen 8080;
        
        location / {
            # 1. Agregar las cabeceras CORS en todas las respuestas
            add_header 'Access-Control-Allow-Origin' 'https://donpiig-dev.github.io' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

            # 2. Responder automáticamente al Preflight (Petición OPTIONS del navegador)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' 'https://donpiig-dev.github.io';
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
                add_header 'Access-Control-Allow-Headers' 'Content-Type';
                add_header 'Content-Type' 'text/plain charset=UTF-8';
                add_header 'Content-Length' 0;
                return 204;
            }

            # 3. Pasar la petición real a VROOM (que corre en el puerto 3000)
            proxy_pass http://localhost:3000;
        }
    }
}
